<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEasy - Products</title>
  <link rel="stylesheet" href="style.css">
    <script
    src="https://plug-platform.devrev.ai/static/plug.js"
    type="text/javascript">
  </script>
</head>
<body>
  <header>
    <h1>ShopEasy</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="about.html">About</a>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <main>
    <h2>Our Products</h2>
    <div class="product-grid">
      <div class="product">
        <h3>Product 1</h3>
        <p>$10.00</p>
        <button onclick="addToCart('Product 1', 10)">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Product 2</h3>
        <p>$15.00</p>
        <button onclick="addToCart('Product 2', 15)">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Product 3</h3>
        <p>$20.00</p>
        <button onclick="addToCart('Product 3', 20)">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Product 4</h3>
        <p>$25.00</p>
        <button onclick="addToCart('Product 4', 25)">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Product 5</h3>
        <p>$30.00</p>
        <button onclick="addToCart('Product 5', 30)">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Product 6</h3>
        <p>$35.00</p>
        <button onclick="addToCart('Product 6', 35)">Add to Cart</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 ShopEasy Inc.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    async function initializePlug() {
      let sessionToken = localStorage.getItem('sessionToken');

      if (!sessionToken) {
        window.location.href = 'index.html';
        return;
      }

      // Initialize PLuG widget with session token
      window.plugSDK.init({
        app_id: 'DvRvStPZG9uOmNvcmU6ZHZydi1pbi0xOmRldm8vMlVLTnF5R0dkZDpwbHVnX3NldHRpbmcvMV9ffHxfXzIwMjUtMDQtMTYgMDU6MjM6MTMuNzMyMjMwODM4ICswMDAwIFVUQw==xlxendsDvRv',
        session_token: sessionToken
      });

      console.log(window.plugSDK);
      console.log("PLuG widget initialized.");

              //Example of trackEvent
              var properties = {
            "plan" : "Starter",
            "payment_method" : "Credit Card",
            "expiry_date" : "2024-12-12",
            "source": "ShopEasy Product Page"
          };

          window.plugSDK.trackEvent("Shopping_link", properties)
    }

    window.addEventListener('load', initializePlug);

    function logout() {
      localStorage.removeItem('sessionToken'); // Clear session token
      localStorage.removeItem('isLoggedIn'); // Clear the login flag
      window.location.href = 'index.html'; // Redirect to home page
    }
  </script>
</body>
</html>
