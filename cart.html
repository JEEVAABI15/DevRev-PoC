<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEasy - Cart</title>
  <link rel="stylesheet" href="style.css">
    <script
    src="https://plug-platform.devrev.ai/static/plug.js"
    type="text/javascript">
  </script>
</head>
<body>
  <header>
    <h1>ShopEasy</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="about.html">About</a>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <main>
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <p>Total: $<span id="cart-total">0</span></p>
    <button onclick="orderNow()">Order Now</button>
    <div id="order-summary" style="display:none;">
      <h3>Order Summary</h3>
      <ul id="order-items"></ul>
      <p>Total: $<span id="order-total">0</span></p>
      <p id="order-message" style="display:none;">Order Successful!</p>
    </div>
  </main>

  <footer>>
    <p>&copy; 2025 ShopEasy Inc.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    async function initializePlug() {
      let sessionToken = localStorage.getItem('sessionToken');

      if (!sessionToken) {
        window.location.href = 'index.html';
        return;
      }

      // Initialize PLuG widget with session token
      window.plugSDK.init({
        app_id: 'DvRvStPZG9uOmNvcmU6ZHZydi1pbi0xOmRldm8vMlVLTnF5R0dkZDpwbHVnX3NldHRpbmcvMV9ffHxfXzIwMjUtMDQtMTYgMDU6MjM6MTMuNzMyMjMwODM4ICswMDAwIFVUQw==xlxendsDvRv',
        session_token: sessionToken
      });

      console.log(window.plugSDK);
      console.log("PLuG widget initialized.");

                    //Example of trackEvent
                    var properties = {
            "plan" : "Starter",
            "payment_method" : "Credit Card",
            "expiry_date" : "2024-12-12",
            "source": "ShopEasy Cart Page"
          };

          window.plugSDK.trackEvent("Shopping_link", properties)
    }

    window.addEventListener('load', initializePlug);

    function orderNow() {
      const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
      const cartTotal = document.getElementById('cart-total').innerText;
      const orderSummary = document.getElementById('order-summary');
      const orderItemsList = document.getElementById('order-items');
      const orderTotalSpan = document.getElementById('order-total');
      const orderMessage = document.getElementById('order-message');

      // Get user info from localStorage
      const userName = localStorage.getItem('userName');
      const userEmail = localStorage.getItem('userEmail');

      // Prepare order details
      const orderDetails = cartItems.map(item => ({
        name: item.name,
        price: item.price
      }));

      orderItemsList.innerHTML = ''; // Clear previous order items
      let orderItems = '';
      cartItems.forEach(item => {
        orderItems += `<li>${item.name} - $${item.price}</li>`;
      });
      orderItemsList.innerHTML = orderItems;
      orderTotalSpan.innerText = cartTotal;

      orderSummary.style.display = 'block';
      orderMessage.style.display = 'block';

      localStorage.removeItem('cart');
      document.getElementById('cart-items').innerHTML = '';
      document.getElementById('cart-total').innerText = '0';

      // Send order details to backend (example)
      const Orders = fetch('http://localhost:3001/api/submit-order', { // Replace with your actual endpoint
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: userName,
          email: userEmail,
          orderDetails: orderDetails,
          total: cartTotal
        })
      })
      .then(Orders => {
        if (!Orders.ok) {
          throw new Error('Failed to submit order');
        }
        return Orders.json();
      })
      .then(data => {
        console.log('Order submitted successfully:', data);
        alert('Order submitted successfully!');
      })
      .catch(error => {
        console.error('Error submitting order:', error);
        alert('Failed to submit order. Please try again.');
      });
    }

    function logout() {
      localStorage.removeItem('sessionToken'); // Clear session token
      localStorage.removeItem('isLoggedIn'); // Clear the login flag
      window.location.href = 'index.html'; // Redirect to home page
    }
  </script>
</body>
</html>
