<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEasy - Home</title>
  <link rel="stylesheet" href="style.css">
  <script
    src="https://plug-platform.devrev.ai/static/plug.js"
    type="text/javascript">
  </script>

</head>
<body>
  <header>
    <h1>ShopEasy</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="about.html">About</a>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome to ShopEasy</h2>
      <p>Your one-stop shop for everything!</p>
      <a href="products.html" class="btn">Shop Now</a>
    </section>

  </main>


  <footer>
    <p>&copy; 2025 ShopEasy Inc.</p>
  </footer>
  <script>
    async function initializePlug() {
      let sessionToken = localStorage.getItem('sessionToken');
      let isLoggedIn = localStorage.getItem('isLoggedIn');

      if (!sessionToken && isLoggedIn !== 'true') {
        const email = prompt("Please enter your email address:");
        const password = prompt("Please enter your password:"); // Get password, but DON'T store it!
        const name = prompt("Please enter your full name:");

        if (!email || !name || !password) {
          alert("Email, Name and Password are required to start support chat.");
          return;
        }

        const response = await fetch('http://localhost:3001/api/get-devrev-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name }) // Don't send password to backend
        });

        if (!response.ok) {
          const errorData = await response.json();
          console.error("Backend error:", errorData);
          alert("Failed to get session token. Please try again later.");
          return;
        }

        const data = await response.json();
        sessionToken = data.sessionToken;
        localStorage.setItem('sessionToken', sessionToken);
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userName', name);
        localStorage.setItem('userEmail', email);
      }

      if (sessionToken) {
        window.plugSDK.init({
          app_id: 'DvRvStPZG9uOmNvcmU6ZHZydi1pbi0xOmRldm8vMlVLTnF5R0dkZDpwbHVnX3NldHRpbmcvMV9ffHxfXzIwMjUtMDQtMTYgMDU6MjM6MTMuNzMyMjMwODM4ICswMDAwIFVUQw==xlxendsDvRv',
          session_token: sessionToken
        });

        console.log(window.plugSDK);
        console.log("PLuG widget initialized.");

        var properties = {
          "plan": "Starter",
          "payment_method": "Credit Card",
          "expiry_date": "2024-12-12",
          "source": "ShopEasy Home Page"
        };

        window.plugSDK.trackEvent("Shopping_link", properties);
      }
    }

    // Auto-run on page load
    window.addEventListener('load', initializePlug);

    async function logout() {
      const userEmail = localStorage.getItem('userEmail');
      const userName = localStorage.getItem('userName');
      const cartItems = JSON.parse(localStorage.getItem('cart')) || [];

      const logoutSummary = {
        userEmail: userEmail,
        userName: userName,
        orderDetails: cartItems,
        timestamp: new Date().toISOString()
      };

      try {
        const response = await fetch('http://localhost:3001/api/create-devrev-issue', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(logoutSummary)
        });

        if (response.ok) {
          console.log('Logout summary sent to backend successfully.');
        } else {
          console.error('Failed to send logout summary to backend.');
        }
      } catch (error) {
        console.error('Error sending logout summary to backend:', error);
      }

      localStorage.clear(); // Clear all data
      window.location.href = 'index.html'; // Redirect to home page
    }
  </script>

</body>
</html>
